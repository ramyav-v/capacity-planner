spring:
  data:
    rest:
      base-path: /capacityplanner/api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:capacity_planner}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:P@55word}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
management:
  endpoints:
    web:
      base-path: /capacityplanner/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
jwt:
  secret: ${JWT_SECRET:capacity-planner-jwt-secret-key-must-be-at-least-32-chars}
  expiration: 86400000
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4000}
okta:
  issuer-uri: ${OKTA_ISSUER_URI:https://zinier.okta.com}
  client-id: ${OKTA_CLIENT_ID:0oaw4a7gask36zscI4x7}
  client-secret: ${OKTA_CLIENT_SECRET:p9oJKv2HIEM13OMy6ZjN5b-HYcnZ8F_9mhILvaU1lfjSGyeo4oIzdKxqO0Tjj4yY}
  redirect-uri: ${OKTA_REDIRECT_URI:http://localhost:4200/auth/callback}