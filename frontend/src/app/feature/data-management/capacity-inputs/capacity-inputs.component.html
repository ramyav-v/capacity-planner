<div class="manage-allocations">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Manage Allocations</h1>
      <p class="page-subtitle">Enter capacity percentages (0.0 to 1.0) for each resource per week. Total allocation per resource cannot exceed 1.0.</p>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          type="text"
          class="search-input"
          placeholder="Search by name or project..."
          [(ngModel)]="searchText"
          (ngModelChange)="onSearchChange()"
        />
      </div>
      <span class="quarter-badge">{{ quarterLabel }}</span>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-outline" (click)="onExport()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Export
      </button>
      <button class="btn btn-primary" (click)="onAddAllocation()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        Add Allocation
      </button>
    </div>
  </div>

  <!-- AG Grid -->
  <div class="grid-container">
    <ag-grid-angular
      class="ag-theme-alpine"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [animateRows]="true"
      [rowHeight]="48"
      [headerHeight]="40"
      [groupHeaderHeight]="40"
      [domLayout]="'autoHeight'"
      [suppressCellFocus]="true"
      [context]="gridContext"
      (gridReady)="onGridReady($event)"
    />
  </div>
</div>

<!-- Add Allocation Dialog -->
<app-add-allocation
  [isOpen]="isDialogOpen"
  (saveQuarter)="onSaveQuarter($event)"
  (updateQuarter)="onUpdateQuarter($event)"
  (close)="onCloseDialog()"
/>

<!-- Delete Confirmation -->
<div class="modal-overlay" *ngIf="isDeleteConfirmOpen" (click)="cancelDelete()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()">
    <h3 class="confirm-title">Are you sure?</h3>
    <p class="confirm-message">
      This will permanently delete all weekly allocations for
      <strong>{{ rowToDelete?.employeeName }}</strong> on <strong>{{ rowToDelete?.projectName }}</strong>.
    </p>
    <div class="confirm-actions">
      <button class="btn btn-cancel" (click)="cancelDelete()">Cancel</button>
      <button class="btn btn-danger" (click)="confirmDelete()">Delete</button>
    </div>
  </div>
</div>
