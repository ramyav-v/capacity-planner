<div class="organization-page">
  <!-- Tabs -->
  <div class="tabs">
    <a
      *ngFor="let tab of tabs"
      class="tab"
      [routerLink]="tab.route"
      routerLinkActive="active"
    >{{ tab.label }}</a>
  </div>

  <!-- Tab content -->
  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>
</div>
