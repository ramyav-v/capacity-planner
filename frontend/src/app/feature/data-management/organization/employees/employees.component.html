<div class="employees-page">
  <div class="sticky-top">
  <!-- Page header -->
  <div class="page-header">
    <div class="title-row">
      <h1 class="page-title">Employees</h1>
      <span class="count-badge">{{ rowData.length }}</span>
    </div>
    <button class="btn btn-primary" (click)="onAddEmployee()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
      Add Employee
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          type="text"
          class="search-input"
          placeholder="Search employees..."
          [(ngModel)]="searchText"
          (ngModelChange)="onSearchChange()"
        />
      </div>
      <select class="filter-select" [(ngModel)]="filterCompany" (ngModelChange)="onFilterChange()">
        <option value="">All Companies</option>
        <option *ngFor="let c of companies" [value]="c">{{ c }}</option>
      </select>
      <select class="filter-select" [(ngModel)]="filterRegion" (ngModelChange)="onFilterChange()">
        <option value="">All Regions</option>
        <option *ngFor="let r of regions" [value]="r">{{ r }}</option>
      </select>
      <select class="filter-select" [(ngModel)]="filterRole" (ngModelChange)="onFilterChange()">
        <option value="">All Roles</option>
        <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
      </select>
      <select class="filter-select" [(ngModel)]="filterStatus" (ngModelChange)="onFilterChange()">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <button class="btn btn-outline" (click)="onDownloadCsv()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
      Export
    </button>
  </div>
  </div>

  <!-- AG Grid -->
  <div class="grid-container">
    <ag-grid-angular
      class="ag-theme-alpine"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [domLayout]="'autoHeight'"
      [animateRows]="true"
      [rowHeight]="48"
      [headerHeight]="44"
      [pagination]="false"
      [suppressCellFocus]="true"
      (gridReady)="onGridReady($event)"
    />
  </div>

  </div>

<!-- Add/Edit Dialog -->
<app-add-edit-employee
  [isOpen]="isDialogOpen"
  [employee]="editingEmployee"
  (save)="onCreateEmployee($event)"
  (update)="onUpdateEmployee($event)"
  (close)="onCloseDialog()"
/>

<!-- Delete Confirmation -->
<div class="modal-overlay" *ngIf="isDeleteConfirmOpen" (click)="cancelDelete()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()">
    <h3 class="confirm-title">Are you sure?</h3>
    <p class="confirm-message">
      This action cannot be undone. This will permanently delete the employee record.
    </p>
    <div class="confirm-actions">
      <button class="btn btn-cancel" (click)="cancelDelete()">Cancel</button>
      <button class="btn btn-danger" (click)="confirmDelete()">Delete</button>
    </div>
  </div>
</div>
