<div class="dashboard-container">
  <!-- Tab Navigation -->
  <div class="tab-bar">
    <a *ngFor="let tab of tabs"
       class="tab"
       [routerLink]="tab.route"
       routerLinkActive="active-tab">
      {{ tab.label }}
    </a>
  </div>

  <!-- Tab Content -->
  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>
</div>
