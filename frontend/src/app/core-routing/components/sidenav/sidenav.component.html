<nav class="sidenav" [class.collapsed]="isCollapsed">
  <div class="sidenav-toggle" (click)="toggleSidenav()">
    <span class="toggle-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
        <path *ngIf="!isCollapsed" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        <path *ngIf="isCollapsed" d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
      </svg>
    </span>
  </div>

  <ul class="nav-list">
    <li *ngFor="let item of navItems" class="nav-item">
      <!-- Top-level parent -->
      <div
        class="nav-link parent"
        [class.expanded]="item.expanded"
        (click)="toggleExpand(item)"
      >
        <span class="nav-icon">
          <ng-container [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'dashboard'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
            </svg>
            <svg *ngSwitchCase="'storage'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
          </ng-container>
        </span>
        <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
        <span class="expand-icon" *ngIf="!isCollapsed && item.children">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"
               [style.transform]="item.expanded ? 'rotate(180deg)' : 'rotate(0)'"
               style="transition: transform 0.2s">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
          </svg>
        </span>
      </div>

      <!-- Level 2 children -->
      <ul class="nav-children" *ngIf="item.children && item.expanded && !isCollapsed">
        <li *ngFor="let child of item.children" class="nav-child">

          <!-- If child has sub-children (e.g. Organization) → sub-group -->
          <ng-container *ngIf="child.children; else leafChild">
            <div
              class="nav-link sub-group"
              [class.expanded]="child.expanded"
              (click)="toggleExpand(child)"
            >
              <span class="nav-label">{{ child.label }}</span>
              <span class="expand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"
                     [style.transform]="child.expanded ? 'rotate(180deg)' : 'rotate(0)'"
                     style="transition: transform 0.2s">
                  <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
                </svg>
              </span>
            </div>

            <!-- Level 3 grandchildren -->
            <ul class="nav-grandchildren" *ngIf="child.expanded">
              <li *ngFor="let grandchild of child.children" class="nav-grandchild">
                <a
                  class="nav-link leaf level-3"
                  [routerLink]="grandchild.route"
                  routerLinkActive="active"
                >
                  <span class="nav-label">{{ grandchild.label }}</span>
                </a>
              </li>
            </ul>
          </ng-container>

          <!-- Leaf child (e.g. Capacity Inputs) -->
          <ng-template #leafChild>
            <a
              class="nav-link leaf level-2"
              [routerLink]="child.route"
              routerLinkActive="active"
            >
              <span class="nav-label">{{ child.label }}</span>
            </a>
          </ng-template>

        </li>
      </ul>
    </li>
  </ul>
</nav>
